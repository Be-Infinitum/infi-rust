name: release

# Publishes a version of the Rust SDK to crates.io. It only runs by hand, with the
# version (MAJOR.MINOR.PATCH, no "v") chosen on the spot. It repeats the checks and the
# sandbox examples before publishing, then creates the tag and the GitHub release.
#
# crates.io trusted publishing: no long-lived token is stored. The job asks GitHub for an
# OIDC token (id-token: write) and rust-lang/crates-io-auth-action trades it for a
# short-lived crates.io token. The crate must have a trusted publisher configured on
# crates.io for this repository and workflow (release.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0); must match Cargo.toml"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: The version is MAJOR.MINOR.PATCH
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid version: $VERSION (use something like 1.0.0)" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0 # pinned: the generated code goes through this toolchain's rustfmt
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo.toml has this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "beinfi") | .version')"
          if [ "$actual" != "$VERSION" ]; then
            echo "Cargo.toml has version $actual, not $VERSION" >&2
            exit 1
          fi
      - name: The tag does not exist yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi
      - run: make check-generated
      - run: cargo fmt --all --check
      - run: make clippy
      - run: cargo test --workspace
      - run: cargo build --workspace --all-targets
      - name: Examples against the sandbox before publishing
        env:
          INFI_SECRET_KEY: ${{ secrets.INFI_SANDBOX_SECRET_KEY }}
        run: cargo run --example run-all
      - name: Get a short-lived crates.io token (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Create and push the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "infi-rust v$VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
