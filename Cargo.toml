[package]
name = "beinfi"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "Rust SDK for the Infi public API (/v1), generated from the OpenAPI contract"
authors = ["BeInfi <hello@beinfi.com>"]
repository = "https://github.com/Be-Infinitum/infi-rust"
readme = "README.md"
keywords = ["infi", "beinfi", "payments", "billing", "sdk"]
categories = ["api-bindings"]
exclude = [".github", ".cargo", "xtask", "Makefile"]

[workspace]
members = ["xtask"]

[lib]
name = "beinfi"

[dependencies]
hmac = "0.12"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[[example]]
name = "run-all"
path = "examples/run-all.rs"

[[example]]
name = "01-billing-as-code"
path = "examples/01-billing-as-code.rs"

[[example]]
name = "02-one-time-link"
path = "examples/02-one-time-link.rs"

[[example]]
name = "03-subscription-link"
path = "examples/03-subscription-link.rs"

[[example]]
name = "04-usage-based"
path = "examples/04-usage-based.rs"

[[example]]
name = "05-prepaid-credits"
path = "examples/05-prepaid-credits.rs"

[[example]]
name = "06-customer-session"
path = "examples/06-customer-session.rs"

[[example]]
name = "07-reconciliation"
path = "examples/07-reconciliation.rs"

[[example]]
name = "08-checkout-delivery-webhook"
path = "examples/08-checkout-delivery-webhook.rs"
